<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Кадр-заглушка">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#1d1224"/><stop offset="100%" stop-color="#03080b"/></linearGradient>
    <radialGradient id="key" cx="84%" cy="34%" r="54%"><stop offset="0%" stop-color="#d79bff" stop-opacity="0.5"/><stop offset="55%" stop-color="#d79bff" stop-opacity="0.12"/><stop offset="100%" stop-color="#d79bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="shaft" x1="0.5" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#d79bff" stop-opacity="0.26"/><stop offset="100%" stop-color="#d79bff" stop-opacity="0"/></linearGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%"><stop offset="48%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.88"/></radialGradient>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Кадр-заглушка">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0f1d24"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="key" cx="68%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#bfe3e8" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#bfe3e8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#bfe3e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0.55" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#bfe3e8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#bfe3e8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#key)"/>
  <polygon points="780,0 1160,0 660,900 380,900" fill="url(#shaft)"/>

  <g filter="url(#soft)" fill="#04050a" opacity="0.88">
    <ellipse cx="520" cy="690" rx="140" ry="215"/>
    <circle cx="520" cy="452" r="78"/>
    <ellipse cx="1130" cy="800" rx="230" ry="150"/>
  </g>

  <rect width="1600" height="900" fill="url(#vig)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.09"/>
</svg>
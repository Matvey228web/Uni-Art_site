  <g filter="url(#soft)" fill="#02060a" opacity="0.9"><ellipse cx="380" cy="720" rx="118" ry="195"/><circle cx="380" cy="505" r="66"/>
          <ellipse cx="1180" cy="760" rx="150" ry="175"/><circle cx="1180" cy="575" r="80"/></g>

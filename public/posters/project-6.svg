<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Кадр-заглушка">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#141028"/><stop offset="100%" stop-color="#07040b"/></linearGradient>
    <radialGradient id="key" cx="40%" cy="74%" r="54%"><stop offset="0%" stop-color="#b6a6e8" stop-opacity="0.47"/><stop offset="55%" stop-color="#b6a6e8" stop-opacity="0.12"/><stop offset="100%" stop-color="#b6a6e8" stop-opacity="0"/></radialGradient>
    <linearGradient id="shaft" x1="0.5" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="#b6a6e8" stop-opacity="0.26"/><stop offset="100%" stop-color="#b6a6e8" stop-opacity="0"/></linearGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%"><stop offset="48%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.88"/></radialGradient>
